[experiment]
name = "2026-11-02-vrp-hedge"
topic = "Deep_Hedging"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short 25-delta put, 35% stress budget,
# 10-share daily hedge) plus no hedge for puts entered at high VRP
[variants.vrp2.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vrp2.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vrp2.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vrp2.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
vrp_unhedge = 0.02  # primary: unhedged above the live short band

[variants.vrp1.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vrp1.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vrp1.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vrp1.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
vrp_unhedge = 0.01  # sensitivity

[variants.vrp4.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vrp4.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vrp4.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vrp4.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
vrp_unhedge = 0.04  # sensitivity

[pass]
primary = "vrp2"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 20
event = "unhedged"
# floor: round trips entered without a hedge
[[pass.check]]
metric = "pnl"
period = "all"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "all"
rule = "higher"
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "at_most"
value = 87500.0  # absolute: the 35% stress budget of $250k
