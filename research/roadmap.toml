# Research roadmap: the source of the hub's Gantt chart.
# One [[item]] per planned experiment, paper or general research piece.
#   title   short name
#   tag     experiment | paper | general   (paper = read a paper or write up its report)
#   topic   RV_Forecasting | Deep_Hedging | Agentic_Routing | Risk_Management | General
#   owner   name or GitHub handle
#   start   YYYY-MM-DD (no quotes); leave start/end out for an undated idea
#   end     YYYY-MM-DD
#   status  idea | next | active | done
#   card    experiment slug once the card exists (the real card then replaces this item)
#   link    repo path or URL (paper, report)
#   note    one line
#
# Example of a scheduled item:
# [[item]]
# title = "Read Wysocki (2026) learning-to-rank"
# tag = "paper"
# topic = "Agentic_Routing"
# owner = "analyst handle"
# start = 2026-11-09
# end = 2026-11-13
# status = "next"
# link = "docs/papers/Harvesting-the-Volatility-Risk-Premium-A-Learning-to-Rank-Approach.pdf"

