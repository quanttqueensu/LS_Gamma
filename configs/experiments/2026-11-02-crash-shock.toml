[experiment]
name = "2026-11-02-crash-shock"
topic = "Risk_Management"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short put, stress budget, 10-share daily hedge)

[variants.shock15.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.shock15.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.shock15.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.shock15.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
stress_vol_mult = 1.5  # primary: stress IV max(60%, 1.5 x IV)

[variants.budget25.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.budget25.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.budget25.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.budget25.backtest]
put_delta = 0.25
stress_budget = 0.25  # sensitivity
stress_drop = 0.20
stress_vol = 0.60

[variants.budget15.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.budget15.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.budget15.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.budget15.backtest]
put_delta = 0.25
stress_budget = 0.15  # sensitivity
stress_drop = 0.20
stress_vol = 0.60

[pass]
primary = "shock15"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 3
event = "high_iv_entry"
# floor: entries with IV above 40%, where the 1.5x shock binds
[[pass.check]]
metric = "sharpe"
period = "all"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "less_severe"
