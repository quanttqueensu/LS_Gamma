[experiment]
name = "2026-10-21-signal-times"
topic = "Agentic_Routing"
owner = "Gabe Soler (PM)"

# comparison: baseline (paper.toml, signal and hedge 10:15)
[variants.hourly.schedule]
signal = ["10:15", "11:15", "12:15", "13:15", "14:15", "15:15"]  # primary: hourly
hedge = ["10:15", "11:15", "12:15", "13:15", "14:15", "15:15"]

[variants.midday.schedule]
signal = ["12:45"]  # sensitivity: one run, midday
hedge = ["12:45"]

[variants.close.schedule]
signal = ["15:45"]  # sensitivity: one run, near close
hedge = ["15:45"]

[pass]
primary = "hourly"
against = "baseline"
min_events = 0  # entries are the measured quantity
[[pass.check]]
metric = "trades"
period = "all"
rule = "higher"
[[pass.check]]
metric = "trades"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "trades"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "es_5"
period = "all"
rule = "abs_within"
value = 1.10
