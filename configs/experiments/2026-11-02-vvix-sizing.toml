[experiment]
name = "2026-11-02-vvix-sizing"
topic = "Risk_Management"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short 25-delta put, 35% stress budget,
# 10-share daily hedge) plus a VVIX tilt on the stress budget
[variants.vvix.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vvix.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vvix.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vvix.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
size_by = "vvix"
size_tilt = 0.5  # primary: 0.5x-1.5x, larger when VVIX is high

[variants.vvix_light.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vvix_light.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vvix_light.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vvix_light.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
size_by = "vvix"
size_tilt = 0.25  # sensitivity: 0.75x-1.25x

[variants.vvix_reverse.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vvix_reverse.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vvix_reverse.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vvix_reverse.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
size_by = "vvix"
size_tilt = -0.5  # sensitivity: opposite direction

[pass]
primary = "vvix"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 30
event = "round_trip"
[[pass.check]]
metric = "pnl"
period = "all"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "es_5"
period = "all"
rule = "abs_within"
value = 1.1  # tail guard
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "at_most"
value = 87500.0  # absolute: the 35% stress budget of $250k
