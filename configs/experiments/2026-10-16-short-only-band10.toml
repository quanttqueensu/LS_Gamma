[experiment]
name = "2026-10-16-short-only-band10"
topic = "Deep_Hedging"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-16-short-only/short_only runs (not rerun)
[variants.band10.signal]
long_band = -inf  # no long entries
[variants.band10.hedge]
