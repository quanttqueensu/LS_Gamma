[experiment]
name = "2026-11-02-vvix-cap"
topic = "Risk_Management"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short put, stress budget, 10-share daily hedge)

[variants.vvix_cap.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vvix_cap.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vvix_cap.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vvix_cap.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
size_by = "vvix"
size_tilt = 0.5
size_cap = 1.0  # primary: 0.5x-1x, smaller when VVIX is calm

[variants.vvix_cap_light.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.vvix_cap_light.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.vvix_cap_light.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.vvix_cap_light.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
size_by = "vvix"
size_tilt = 0.25
size_cap = 1.0  # sensitivity: 0.75x-1x

[pass]
primary = "vvix_cap"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 30
event = "round_trip"
[[pass.check]]
metric = "sharpe"
period = "all"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "less_severe"
