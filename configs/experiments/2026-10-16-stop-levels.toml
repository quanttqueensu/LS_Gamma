[experiment]
name = "2026-10-16-stop-levels"
topic = "Risk_Management"
owner = "Gabe Soler (PM)"
# stop_cooloff_days stays at the live 1

[variants.tight.exit]
short_stop_mult = 0.5  # H1 primary
long_stop_frac = 0.25

[variants.profit25.exit]
