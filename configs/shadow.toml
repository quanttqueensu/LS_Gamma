# Shadow books: each idea's config replayed on the daily live snapshots
# (data/live), filled at the quoted bid/ask. No orders, no registry trials.
# python -m lsgamma.trading.shadow writes research/shadow.json for the hub.

[shadow]
start = "2026-09-26"  # first live snapshot
capital = 250000  # per book
min_days = 60  # trading days before comparing P&L

