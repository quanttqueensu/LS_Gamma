[experiment]
name = "2026-11-02-crash-call"
topic = "Agentic_Routing"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short put, stress budget, 10-share daily hedge)

[variants.crash11.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.crash11.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.crash11.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.crash11.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
crash_gate = 1.1  # primary: VIX/VIX3M at prior close
crash_dte = [8, 10, 14]
crash_days = 5
crash_premium = 0.005  # $1,250 of calls per trigger

[variants.crash10.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.crash10.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.crash10.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.crash10.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
crash_gate = 1.0  # sensitivity: any inversion
crash_dte = [8, 10, 14]
crash_days = 5
crash_premium = 0.005

[variants.crash11_30d.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.crash11_30d.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.crash11_30d.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.crash11_30d.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
crash_gate = 1.1
crash_dte = [21, 30, 45]  # sensitivity: desk's 30-DTE call
crash_days = 5
crash_premium = 0.005

[pass]
primary = "crash11"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 10
event = "crash"
# floor: crash calls opened
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "less_severe"
[[pass.check]]
metric = "es_5"
period = "all"
rule = "less_severe"
[[pass.check]]
metric = "pnl"
period = "all"
rule = "not_below"
value = 10000.0  # allowed shortfall vs hedged
