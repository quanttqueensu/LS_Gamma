[experiment]
name = "2026-11-05-ltr-puts"
topic = "Agentic_Routing"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short put, 35% stress budget, 10-share hedge);
# from 2017 a LightGBM LambdaRank ranker picks each day's put delta or no trade;
# before 2017 (first training window) and on days without a pick: 25-delta
# picks are written by experiment.py before the runs (results/research, not committed)

[variants.ltr.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.ltr.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.ltr.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.ltr.backtest]
put_delta = 0.25  # fallback: the reference book
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
put_picks = "2026-11-05-ltr-puts/ranker/picks_ltr.parquet"  # primary: top pick, SKIP, gate

[variants.ltr_nogate.signal]
long_band = -inf
short_band = -inf
[variants.ltr_nogate.exit]
flat_days = 999
[variants.ltr_nogate.hedge]
min_shares = 10
[variants.ltr_nogate.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
put_picks = "2026-11-05-ltr-puts/ranker/picks_ltr_nogate.parquet"  # sensitivity: no gate

[variants.ltr_noskip.signal]
long_band = -inf
short_band = -inf
[variants.ltr_noskip.exit]
flat_days = 999
[variants.ltr_noskip.hedge]
min_shares = 10
[variants.ltr_noskip.backtest]
put_delta = 0.25
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60
put_picks = "2026-11-05-ltr-puts/ranker/picks_ltr_noskip.parquet"  # sensitivity: best put, never skip

[pass]
primary = "ltr"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 30
event = "round_trip"
[[pass.check]]
metric = "sharpe"
period = "all"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "sharpe"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "at_most"
value = 87500.0  # absolute: the 35% stress budget of $250k
[[pass.check]]
metric = "es_5"
period = "all"
rule = "abs_within"
value = 1.1  # tail guard
