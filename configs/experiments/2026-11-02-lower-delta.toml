[experiment]
name = "2026-11-02-lower-delta"
topic = "Agentic_Routing"
owner = "Gabe Soler (PM)"

# reference: registered 2026-10-22-stress-sized-puts/hedged (reused, not rerun)
# every variant: that book (always-short put, stress budget, 10-share daily hedge)

[variants.put20.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.put20.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.put20.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.put20.backtest]
put_delta = 0.20  # primary
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60

[variants.put15.signal]
long_band = -inf  # no long entries
short_band = -inf  # always short: signal ignored
[variants.put15.exit]
flat_days = 999  # flat exit off (cannot fire anyway)
[variants.put15.hedge]
min_shares = 10  # hedged book's 10-share hedge
[variants.put15.backtest]
put_delta = 0.15  # sensitivity
stress_budget = 0.35
stress_drop = 0.20
stress_vol = 0.60

[pass]
primary = "put20"
against = "hedged"  # registered reference; hold-out: its hold-out run
min_events = 30
event = "round_trip"
[[pass.check]]
metric = "pnl"
period = "all"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2014-2019"
rule = "higher"
[[pass.check]]
metric = "pnl"
period = "2020-2024"
rule = "higher"
[[pass.check]]
metric = "es_5"
period = "all"
rule = "abs_within"
value = 1.1  # tail guard
[[pass.check]]
metric = "max_dd"
period = "all"
rule = "at_most"
value = 87500.0  # absolute: the 35% stress budget of $250k
