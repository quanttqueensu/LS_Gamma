[variants.both.exit]
short_stop_mult = 0.5  # reported only, no bar
long_stop_frac = 0.25
short_profit_frac = 0.25

[pass]
h1_variant = "tight"
h1_es_ratio = 0.80  # |ES| at most this x baseline
h1_pnl_give = 300.0  # USD of full-window net P&L
h2_variant = "profit25"
h2_es_ratio = 1.10  # |ES| at most this x baseline
